<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de formulário</title>
</head>
<body>
    <main>
        <h1>Cadastro para contato</h1>
        <form id="formulario-contato" novalidate>
            <div>
                <label for="nome">Nome</label>
                <input id="nome" name="nome" type="text" aria-describedby="erro-nome">
                <p id="erro-nome" aria-live="polite"></p>
            </div>

            <div>
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" aria-describedby="erro-email">
                <p id="erro-email" aria-live="polite"></p>
            </div>

            <button type="submit">Enviar cadastro</button>
        </form>
        <p id="mensagem-sucesso" aria-live="polite"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
