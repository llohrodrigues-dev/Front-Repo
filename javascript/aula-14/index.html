<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de tabuada</title>
</head>
<body>
    <main>
        <h1>Gerador de tabuada</h1>
        <form id="formulario-tabuada">
            <label for="numero">Escolha um número</label>
            <input id="numero" name="numero" type="number" required>
            <button type="submit">Gerar tabuada</button>
        </form>
        <ol id="tabuada" aria-live="polite"></ol>
    </main>

    <script src="script.js"></script>
</body>
</html>
