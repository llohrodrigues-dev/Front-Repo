<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entendendo Promises</title>
</head>
<body>
    <main>
        <h1>Entendendo Promises</h1>
        <p>A requisição pode terminar com sucesso ou falhar.</p>

        <button id="botao-carregar" type="button">Carregar dados</button>
        <p id="mensagem" role="status" aria-live="polite">Aguardando a busca.</p>

        <section id="resultado" aria-labelledby="titulo-resultado" hidden>
            <h2 id="titulo-resultado">Resultado</h2>
            <p id="dados-usuario"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
