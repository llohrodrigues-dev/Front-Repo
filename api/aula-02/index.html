<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha primeira requisição</title>
</head>
<body>
    <main>
        <h1>Minha primeira requisição</h1>
        <p>Os dados abaixo serão buscados no JSONPlaceholder.</p>

        <button id="botao-buscar" type="button">Buscar usuário</button>
        <p id="mensagem" role="status" aria-live="polite">Clique no botão para iniciar.</p>

        <section id="resultado" aria-labelledby="titulo-usuario" hidden>
            <h2 id="titulo-usuario">Usuário encontrado</h2>
            <p><strong>Nome:</strong> <span id="nome"></span></p>
            <p><strong>E-mail:</strong> <span id="email"></span></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
