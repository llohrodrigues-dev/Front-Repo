<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usando async e await</title>
</head>
<body>
    <main>
        <h1>Usando async e await</h1>
        <p>O exemplo busca uma publicação e espera cada etapa terminar.</p>

        <button id="botao-buscar" type="button">Buscar publicação</button>
        <p id="mensagem" role="status" aria-live="polite">Clique no botão para começar.</p>

        <article id="publicacao" aria-labelledby="titulo-publicacao" hidden>
            <h2 id="titulo-publicacao"></h2>
            <p id="texto-publicacao"></p>
        </article>
    </main>

    <script src="script.js"></script>
</body>
</html>
