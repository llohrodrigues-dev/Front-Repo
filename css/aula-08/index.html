<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula 08 - Propriedade Display</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Cabeçalho -->
<header>
    <h1>Aprendendo a propriedade display</h1>
</header>

<!-- Menu -->
<nav>
    <a href="#">Home</a>
    <a href="#">Sobre</a>
    <a href="#">Exemplos</a>
</nav>

<!-- Exemplo display block -->
<section>
    <h2>Display block</h2>
    <div class="bloco">Bloco 1</div>
    <div class="bloco">Bloco 2</div>
</section>

<!-- Exemplo display inline -->
<section>
    <h2>Display inline</h2>
    <span class="linha">Texto 1</span>
    <span class="linha">Texto 2</span>
</section>

<!-- Exemplo display inline-block -->
<section>
    <h2>Display inline-block</h2>
    <div class="caixa-inline">Caixa 1</div>
    <div class="caixa-inline">Caixa 2</div>
</section>

<!-- Exemplo display none -->
<section>
    <h2>Display none</h2>
    <div class="sumido">Este texto some</div>
    <p>Este parágrafo continua aparecendo.</p>
</section>

<!-- Rodapé -->
<footer>
    <p>Exemplo simples para estudar display.</p>
</footer>
</body>
</html>
