<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula 09 - Introdução ao Flexbox</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Cabeçalho -->
<header>
    <h1>Introdução ao Flexbox</h1>
</header>

<!-- Menu -->
<nav>
    <a href="#">Início</a>
    <a href="#">Sobre</a>
    <a href="#">Contato</a>
</nav>

<!-- Exemplo Flexbox em linha -->
<section class="linha">
    <h2>Flexbox em linha</h2>
    <div class="container-row">
        <article class="card">Card 1</article>
        <article class="card">Card 2</article>
        <article class="card">Card 3</article>
    </div>
</section>

<!-- Exemplo Flexbox em coluna -->
<section class="coluna">
    <h2>Flexbox em coluna</h2>
    <div class="container-column">
        <article class="card">Card A</article>
        <article class="card">Card B</article>
        <article class="card">Card C</article>
    </div>
</section>

<!-- Rodapé -->
<footer>
    <p>Exemplo simples para aprender Flexbox.</p>
</footer>
</body>
</html>
