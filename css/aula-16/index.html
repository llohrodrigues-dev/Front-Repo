<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula 16 - Pseudo-classes e Efeitos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Cabeçalho -->
<header>
    <h1>Empresa Estudo</h1>
</header>

<!-- Menu -->
<nav>
    <a href="#">Início</a>
    <a href="#">Serviços</a>
    <a href="#">Contato</a>
</nav>

<!-- Banner -->
<section class="banner">
    <h2>Pequenos efeitos para deixar a página mais bonita</h2>
    <p>Esta página mostra exemplos simples de hover, focus e transições.</p>
</section>

<!-- Serviços -->
<section class="servicos">
    <h2>Serviços</h2>
    <article class="card">Design simples</article>
    <article class="card">Planejamento claro</article>
    <article class="card">Suporte inicial</article>
</section>

<!-- Formulário -->
<section class="formulario">
    <h2>Entre em contato</h2>
    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome">
    <button>Enviar</button>
</section>

<!-- Rodapé -->
<footer>
    <p>Exemplo simples de CSS com efeitos.</p>
</footer>
</body>
</html>
