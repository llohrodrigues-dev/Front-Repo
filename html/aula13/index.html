<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabela de notas da turma</title>
</head>
<body>
<!-- Título principal -->
<h1>Tabela de notas da turma</h1>
<!-- Texto explicativo -->
<p>Esta tabela mostra as notas de alguns alunos fictícios.</p>

<table>
<!-- Cabeçalho da tabela -->
<thead>
<tr>
<th>Nome</th>
<th>Matemática</th>
<th>Português</th>
<th>Média</th>
</tr>
</thead>

<!-- Corpo da tabela -->
<tbody>
<tr>
<td>Maria</td>
<td>8.5</td>
<td>7.0</td>
<td>7.75</td>
</tr>
<tr>
<td>João</td>
<td>6.0</td>
<td>8.5</td>
<td>7.25</td>
</tr>
<tr>
<td>Ana</td>
<td>9.0</td>
<td>8.0</td>
<td>8.5</td>
</tr>
<tr>
<td>Pedro</td>
<td>7.5</td>
<td>6.5</td>
<td>7.0</td>
</tr>
<tr>
<td>Laura</td>
<td>8.0</td>
<td>9.0</td>
<td>8.5</td>
</tr>
</tbody>

<!-- Rodapé da tabela -->
<tfoot>
<tr>
<td colspan="3">Média geral da turma</td>
<td>7.75</td>
</tr>
</tfoot>
</table>

<p>Exemplo simples de rowspan:</p>
<table>
<tr>
<th>Aluno</th>
<th>Turma</th>
</tr>
<tr>
<td rowspan="2">Carlos</td>
<td>A</td>
</tr>
<tr>
<td>B</td>
</tr>
</table>
</body>
</html>
