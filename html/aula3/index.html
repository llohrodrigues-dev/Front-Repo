<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Principais formatações de texto</title>
</head>
<body>
<!-- Título da página -->
<h1>Principais formatações de texto</h1>
<!-- Parágrafo -->
<p>Esta página mostra exemplos simples de formatação de texto.</p>

<!-- Texto em negrito -->
<p><strong>Este texto está em negrito.</strong></p>

<!-- Texto em itálico -->
<p><em>Este texto está em destaque.</em></p>

<!-- Texto marcado -->
<p><mark>Este texto está marcado.</mark></p>

<!-- Texto pequeno -->
<p><small>Este texto está menor.</small></p>

<!-- Texto removido -->
<p><del>Este texto foi removido.</del></p>

<!-- Texto inserido -->
<p><ins>Este texto foi inserido.</ins></p>

<!-- Texto subscrito -->
<p>H<sub>2</sub>O</p>

<!-- Texto sobrescrito -->
<p>2<sup>2</sup> = 4</p>
</body>
</html>
