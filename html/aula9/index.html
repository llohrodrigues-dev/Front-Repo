<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprendendo a utilizar imagens no HTML</title>
</head>
<body>
<!-- Título principal -->
<h1>Aprendendo a utilizar imagens no HTML</h1>
<!-- Parágrafo -->
<p>Esta página mostra exemplos simples de imagens.</p>

<!-- Primeira imagem -->
<img src="imagens/paisagem.jpg" alt="Paisagem bonita" width="300">

<!-- Segunda imagem -->
<img src="imagens/computador.png" alt="Computador na mesa" height="200">

<!-- Terceira imagem -->
<img src="imagens/logo.png" alt="Logo do site">
</body>
</html>
