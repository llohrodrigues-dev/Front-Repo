<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testando áudios no HTML5</title>
</head>
<body>
<!-- Título principal -->
<h1>Testando áudios no HTML5</h1>
<!-- Parágrafo -->
<p>Esta página mostra um exemplo simples de áudio.</p>

<!-- Player de áudio -->
<audio controls>
<!-- Arquivos de áudio -->
<source src="audios/musica.mp3" type="audio/mpeg">
<source src="audios/musica.ogg" type="audio/ogg">
</audio>

<!-- Alguns navegadores podem usar formatos diferentes -->
<p>Alguns navegadores podem usar formatos diferentes.</p>
</body>
</html>
