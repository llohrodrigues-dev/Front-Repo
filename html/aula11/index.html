<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprendendo a adicionar vídeos no HTML5</title>
</head>
<body>
<!-- Título principal -->
<h1>Aprendendo a adicionar vídeos no HTML5</h1>
<!-- Parágrafo -->
<p>Esta página mostra um exemplo simples de vídeo.</p>

<!-- Player de vídeo -->
<video controls width="500" poster="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.jpg">
<!-- Arquivos do vídeo -->
<source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
Seu navegador não consegue reproduzir este vídeo.
</video>

<!-- Imagem de capa -->
<p>Essa é a imagem de capa do vídeo.</p>
</body>
</html>
