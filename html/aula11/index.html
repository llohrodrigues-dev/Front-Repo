<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprendendo a adicionar vídeos no HTML5</title>
</head>
<body>
<!-- Título principal -->
<h1>Aprendendo a adicionar vídeos no HTML5</h1>
<!-- Parágrafo -->
<p>Esta página mostra um exemplo simples de vídeo.</p>

<!-- Player de vídeo -->
<video controls width="500" poster="imagens/capa.jpg">
<!-- Arquivos do vídeo -->
<source src="videos/aula.mp4" type="video/mp4">
<source src="videos/aula.webm" type="video/webm">
</video>

<!-- Imagem de capa -->
<p>Essa é a imagem de capa do vídeo.</p>
</body>
</html>
