<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprendendo listas no HTML</title>
</head>
<body>
<!-- Título principal -->
<h1>Aprendendo listas no HTML</h1>
<!-- Parágrafo -->
<p>Esta página mostra exemplos simples de listas.</p>

<!-- Lista não ordenada -->
<p>Lista de frutas.</p>
<ul>
<li>Maçã</li>
<li>Banana</li>
<li>Uva</li>
<li>Pera</li>
<li>Manga</li>
</ul>

<!-- Lista ordenada -->
<p>Lista de materiais escolares.</p>
<ol>
<li>Lápis</li>
<li>Caneta</li>
<li>Caderno</li>
<li>Apontador</li>
<li>Borracha</li>
</ol>

<!-- Observação final -->
<p>Eu achei a lista ordenada mais interessante.</p>
</body>
</html>
