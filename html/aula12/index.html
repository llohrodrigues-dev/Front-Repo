<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprendendo tabelas no HTML</title>
</head>
<body>
<!-- Título principal -->
<h1>Aprendendo tabelas no HTML</h1>
<!-- Parágrafo -->
<p>Esta página mostra um exemplo simples de tabela.</p>

<!-- Início da tabela -->
<table>
<caption>Alunos da turma</caption>

<!-- Cabeçalho -->
<tr>
<th>Nome</th>
<th>Idade</th>
<th>Cidade</th>
</tr>

<!-- Dados -->
<tr>
<td>Maria</td>
<td>15</td>
<td>São Paulo</td>
</tr>
<tr>
<td>João</td>
<td>16</td>
<td>Rio de Janeiro</td>
</tr>
<tr>
<td>Ana</td>
<td>14</td>
<td>Belo Horizonte</td>
</tr>
<tr>
<td>Pedro</td>
<td>17</td>
<td>Salvador</td>
</tr>
</table>
</body>
</html>
