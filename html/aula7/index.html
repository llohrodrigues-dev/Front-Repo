<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprendendo a criar links</title>
</head>
<body>
<!-- Título principal -->
<h1>Aprendendo a criar links</h1>
<!-- Texto introdutório -->
<p>Esta página mostra exemplos simples de links.</p>

<!-- Link externo -->
<p><a href="https://www.google.com">Google</a></p>
<p><a href="https://www.youtube.com">YouTube</a></p>
<p><a href="https://developer.mozilla.org/pt-BR/">MDN</a></p>

<!-- Link abrindo em outra aba -->
<p><a href="https://www.wikipedia.org" target="_blank" rel="external">Wikipedia</a></p>

<!-- Observação final -->
<p>Eu gosto mais de visitar o YouTube.</p>
</body>
</html>
